<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">Grand Line Activity Log</title><desc id="desc">A One Piece inspired animated voyage timeline for coding activity, with milestone cards and a ship sailing along a dotted route. This is a decorative activity log, not a contribution heatmap.</desc>
<defs>
 <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset=".55" stop-color="#103b50"/><stop offset="1" stop-color="#07121f"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f7b733"/><stop offset=".5" stop-color="#fff0ae"/><stop offset="1" stop-color="#d88a16"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>
 .heading{font:700 27px 'Trebuchet MS',sans-serif;letter-spacing:3px;fill:#ffd166}.sub{font:13px monospace;letter-spacing:1.5px;fill:#c8dce6}.cardhead{font:700 17px 'Trebuchet MS',sans-serif;fill:#ffe0a0}.body{font:14px monospace;fill:#d8e6eb}.small{font:11px monospace;fill:#a7c4d0}.wave{fill:none;stroke:#2b91a8;stroke-width:2;opacity:.45;animation:wave 6s ease-in-out infinite}.route{fill:none;stroke:#ffd166;stroke-width:3;stroke-dasharray:8 10;animation:dash 14s linear infinite}.ship{animation:sail 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.star{animation:twinkle 2.5s ease-in-out infinite}.card{fill:#102b3b;stroke:#bd8738;stroke-width:1.5}.node{fill:#ffd166;stroke:#fff0ae;stroke-width:3;filter:url(#glow)}
 @keyframes dash{to{stroke-dashoffset:-180}} @keyframes sail{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-6px) rotate(1deg)}} @keyframes wave{0%,100%{transform:translateX(0);opacity:.25}50%{transform:translateX(16px);opacity:.7}} @keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1;filter:drop-shadow(0 0 5px #ffd166)}}
 </style>
</defs>
<rect width="1200" height="340" rx="18" fill="url(#ocean)"/><rect x="7" y="7" width="1186" height="326" rx="14" fill="none" stroke="#bd8738" stroke-width="2"/>
<path class="wave" d="M15 94 Q80 70 145 94 T275 94 T405 94 T535 94 T665 94 T795 94 T925 94 T1055 94 T1185 94"/><path class="wave" d="M15 300 Q80 276 145 300 T275 300 T405 300 T535 300 T665 300 T795 300 T925 300 T1055 300 T1185 300"/>
<text x="34" y="42" class="heading">GRAND LINE // ACTIVITY LOG</text><text x="36" y="65" class="sub">A VOYAGE THROUGH BUILDS, FIXES &amp; NEW DISCOVERIES</text>
<g transform="translate(1042 18)" class="ship" filter="url(#glow)"><path d="M0 42 L112 42 L91 63 L20 63 Z" fill="#8d4327" stroke="#ffd166" stroke-width="2"/><path d="M49 39 L49 0 L82 32 Z" fill="#f7dba1" stroke="#ffd166" stroke-width="2"/><path d="M43 38 L43 8 L15 34 Z" fill="#c93642" stroke="#ffd166" stroke-width="2"/><path d="M48 0 L48 43" stroke="#ffe6a3" stroke-width="3"/><circle cx="65" cy="22" r="6" fill="#102b3b"/><path d="M-9 68 Q14 60 37 68 T82 68 T120 68" fill="none" stroke="#4bc0d9" stroke-width="2"/></g>
<!-- voyage route, deliberately not a contribution grid -->
<path class="route" d="M95 170 C210 112 290 220 400 170 S600 120 710 170 S900 225 1090 160"/>
<g><circle class="node" cx="110" cy="164" r="7"/><circle class="node" cx="365" cy="178" r="7"/><circle class="node" cx="620" cy="155" r="7"/><circle class="node" cx="870" cy="202" r="7"/><circle class="node" cx="1080" cy="163" r="7"/></g>
<g transform="translate(32 104)"><rect class="card" width="190" height="126" rx="12"/><text x="16" y="29" class="cardhead">01 / BUILD</text><text x="16" y="57" class="body">New ideas</text><text x="16" y="78" class="body">become projects.</text><text x="16" y="108" class="small">SET SAIL</text></g>
<g transform="translate(268 190)"><rect class="card" width="194" height="108" rx="12"/><text x="16" y="28" class="cardhead">02 / DEBUG</text><text x="16" y="55" class="body">Find the bug.</text><text x="16" y="76" class="body">Fix the course.</text></g>
<g transform="translate(520 99)"><rect class="card" width="202" height="112" rx="12"/><text x="16" y="29" class="cardhead">03 / LEARN</text><text x="16" y="57" class="body">Every skill is</text><text x="16" y="78" class="body">a new island.</text></g>
<g transform="translate(774 213)"><rect class="card" width="202" height="85" rx="12"/><text x="16" y="28" class="cardhead">04 / IMPROVE</text><text x="16" y="55" class="body">Cleaner code.</text><text x="16" y="73" class="small">STRONGER CREW</text></g>
<g transform="translate(1010 105)"><rect class="card" width="158" height="110" rx="12"/><text x="14" y="29" class="cardhead">NEXT ISLAND</text><text x="14" y="56" class="body">Keep</text><text x="14" y="76" class="body">exploring.</text><text x="14" y="97" class="small">NO FINAL BOSS</text></g>
<g class="star"><path d="M245 82 l4 9 10 1 -8 6 2 10 -8 -5 -8 5 2 -10 -8 -6 10 -1z" fill="#ffd166"/><path d="M740 65 l3 7 8 1 -6 5 2 8 -7 -4 -7 4 2 -8 -6 -5 8 -1z" fill="#ffd166"/><path d="M990 282 l3 7 8 1 -6 5 2 8 -7 -4 -7 4 2 -8 -6 -5 8 -1z" fill="#ffd166"/></g>
<text x="34" y="320" class="small">NOVIN'S DEV VOYAGE</text><text x="1166" y="320" text-anchor="end" class="small">LEARN • BUILD • REPEAT</text>
</svg>
